name: Security Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-pattern-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for high-risk credential patterns
        shell: bash
        run: |
          set -euo pipefail

          PATTERN='(sk_(live|test)_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,}|mongodb\+srv://[^[:space:]]+:[^[:space:]@]+@|CLERK_SECRET_KEY=sk_[A-Za-z0-9_-]{20,}|UPLOADTHING_SECRET=sk_[A-Za-z0-9_-]{20,})'

          if git grep -nEI "$PATTERN" --             ':!.env.example'             ':!server/.env.example'             ':!SECURITY.md'             ':!DEPLOYMENT.md'; then
            echo "Potential live credential detected in a tracked file."
            exit 1
          fi

          echo "No high-risk credential patterns found."

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_build_placeholder
          CLERK_SECRET_KEY: sk_test_build_placeholder
          WEBHOOK_SECRET: whsec_build_placeholder
          MONGODB_URI: mongodb://localhost:27017/evently
          UPLOADTHING_SECRET: sk_build_placeholder
          UPLOADTHING_APP_ID: build-placeholder
          STRIPE_SECRET_KEY: sk_test_build_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_placeholder
        run: npm run build
